<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Lianzon Auto Services | Redirecting</title>
  <meta name="description" content="Vehicle and auto parts sourcing, inspection, export documentation and shipping coordination.">
  <link rel="canonical" href="https://lianzonauto.com/en/service.html">
  <script>
    (function () {
      var supported = ['zh', 'en', 'ru', 'ar', 'es', 'fr'];
      var preferences = (navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || ''])
        .map(function (value) { return String(value).toLowerCase(); });
      var language = 'en';
      for (var i = 0; i < preferences.length; i++) {
        var candidate = preferences[i].split('-')[0];
        if (supported.indexOf(candidate) !== -1) {
          language = candidate;
          break;
        }
      }
      window.location.replace('./' + language + '/service.html');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=./en/service.html"></noscript>
</head>
<body>
  <p>Lianzon Auto — redirecting to your language.</p>
  <p><a href="./en/service.html">Continue in English</a></p>
</body>
</html>
